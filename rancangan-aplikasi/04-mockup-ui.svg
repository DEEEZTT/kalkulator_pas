<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mockup akhir aplikasi kalkulator</title>
  <desc id="desc">Mockup kalkulator pada layar desktop dan ponsel dengan dua input, empat operasi, field hasil, rumus, validasi, dan tombol bersihkan.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1d383d}.muted{fill:#586e70}.small{font-size:14px}.label{font-size:13px;font-weight:700;letter-spacing:1.2px}.title{font-size:37px;font-weight:700;letter-spacing:-1px}.card{fill:#fbfcfa;stroke:#cbd8d5;stroke-width:2}.field{fill:#fff;stroke:#c7d4d5;stroke-width:2}.op{fill:#176b70}.active{fill:#a85e32}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#18364a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#edf3f1"/>
  <text x="90" y="86" class="label" fill="#16766f">RANCANGAN APLIKASI · 04</text>
  <text x="90" y="145" class="title">Mockup antarmuka kalkulator.</text>
  <text x="90" y="181" font-size="16" class="muted">Tampilan final mengikuti struktur wireframe dan panduan visual.</text>

  <text x="190" y="240" class="label" fill="#586e70">DESKTOP</text>
  <rect x="120" y="265" width="780" height="650" rx="18" fill="#f9fbfa" stroke="#cbd8d5" stroke-width="2"/>
  <rect x="120" y="265" width="780" height="7" rx="4" fill="#16766f"/>
  <g filter="url(#shadow)"><rect x="300" y="306" width="420" height="565" rx="14" class="card"/></g>
  <rect x="326" y="334" width="40" height="40" rx="9" fill="#e0efeb" stroke="#b8d8d1"/><text x="346" y="362" text-anchor="middle" font-size="23" font-weight="700" fill="#16766f">±</text>
  <text x="380" y="352" font-size="24" font-weight="700">Kalkulator</text><text x="495" y="352" font-size="15" class="muted">Calculator</text>
  <text x="380" y="380" class="small">Masukkan dua angka dan pilih operasi.</text><text x="380" y="401" font-size="12" class="muted">Enter two numbers and choose an operation.</text>
  <text x="326" y="440" font-size="13" font-weight="700">Angka pertama</text><text x="675" y="440" text-anchor="end" font-size="11" class="muted">First number</text>
  <rect x="326" y="450" width="368" height="49" rx="7" class="field"/><text x="342" y="481" class="small">210</text>
  <text x="326" y="531" font-size="13" font-weight="700">Angka kedua</text><text x="675" y="531" text-anchor="end" font-size="11" class="muted">Second number</text>
  <rect x="326" y="541" width="368" height="49" rx="7" class="field"/><text x="342" y="572" class="small">7</text>
  <text x="326" y="621" font-size="13" font-weight="700">Operasi</text><text x="390" y="621" font-size="11" class="muted">Operation</text>
  <g><rect x="326" y="632" width="82" height="57" rx="7" class="op"/><rect x="416" y="632" width="82" height="57" rx="7" class="op"/><rect x="506" y="632" width="82" height="57" rx="7" class="op"/><rect x="596" y="632" width="98" height="57" rx="7" class="active"/></g>
  <g fill="#fff" font-size="20" font-weight="700" text-anchor="middle"><text x="367" y="662">+</text><text x="457" y="662">−</text><text x="547" y="662">×</text><text x="645" y="662">÷</text></g>
  <g fill="#fff" font-size="9" text-anchor="middle"><text x="367" y="679">Addition</text><text x="457" y="679">Subtraction</text><text x="547" y="679">Multiplication</text><text x="645" y="679">Division</text></g>
  <text x="326" y="723" font-size="13" font-weight="700">Hasil</text><text x="694" y="723" text-anchor="end" font-size="11" class="muted">Result</text>
  <rect x="326" y="733" width="368" height="55" rx="7" fill="#f0f6f4" stroke="#b5ceca" stroke-width="2"/><text x="342" y="768" font-size="21" font-weight="700" fill="#155d5a">30</text>
  <text x="694" y="809" text-anchor="end" font-size="13" font-weight="700" fill="#155d5a">210 ÷ 7 = 30</text>
  <rect x="326" y="826" width="368" height="31" rx="6" fill="#e2f0ed" stroke="#9abeb8"/><text x="510" y="847" text-anchor="middle" font-size="12" font-weight="700" fill="#155d5a">×  Bersihkan   Clear</text>

  <text x="1070" y="240" class="label" fill="#586e70">PONSEL</text>
  <rect x="1050" y="265" width="360" height="650" rx="38" fill="#d9e2df" stroke="#b4c3bf" stroke-width="3"/>
  <rect x="1067" y="286" width="326" height="610" rx="26" fill="#fbfcfa" stroke="#cbd8d5" stroke-width="2"/>
  <rect x="1162" y="298" width="135" height="8" rx="4" fill="#b9c7c3"/>
  <rect x="1088" y="332" width="34" height="34" rx="8" fill="#e0efeb" stroke="#b8d8d1"/><text x="1105" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#16766f">±</text>
  <text x="1133" y="351" font-size="19" font-weight="700">Kalkulator</text>
  <text x="1088" y="391" class="small">Angka pertama</text><rect x="1088" y="400" width="284" height="45" rx="7" class="field"/><text x="1102" y="428" font-size="12">210</text>
  <text x="1088" y="477" class="small">Angka kedua</text><rect x="1088" y="486" width="284" height="45" rx="7" class="field"/><text x="1102" y="514" font-size="12">7</text>
  <text x="1088" y="561" class="small">Operasi</text>
  <g><rect x="1088" y="571" width="136" height="51" rx="7" class="op"/><rect x="1236" y="571" width="136" height="51" rx="7" class="op"/><rect x="1088" y="632" width="136" height="51" rx="7" class="op"/><rect x="1236" y="632" width="136" height="51" rx="7" class="active"/></g>
  <g fill="#fff" font-size="19" font-weight="700" text-anchor="middle"><text x="1156" y="601">+  Addition</text><text x="1304" y="601">−  Subtraction</text><text x="1156" y="662">×  Multiplication</text><text x="1304" y="662">÷  Division</text></g>
  <text x="1088" y="714" class="small">Hasil</text><rect x="1088" y="723" width="284" height="50" rx="7" fill="#f0f6f4" stroke="#b5ceca" stroke-width="2"/><text x="1102" y="755" font-size="20" font-weight="700" fill="#155d5a">30</text>
  <text x="1372" y="798" text-anchor="end" font-size="12" font-weight="700" fill="#155d5a">210 ÷ 7 = 30</text>
  <rect x="1088" y="818" width="284" height="42" rx="7" fill="#e2f0ed" stroke="#9abeb8"/><text x="1230" y="844" text-anchor="middle" font-size="12" font-weight="700" fill="#155d5a">×  Bersihkan  Clear</text>
  <text x="120" y="953" class="small muted">Catatan mockup: angka di layar hanya contoh visual. Validasi pembagian nol ditampilkan pada rancangan state.</text>
</svg>
